# =============================================================================
# Open Bias Configuration Schema Reference
# =============================================================================
#
# This file documents all valid keys for openbias.yaml.
# It serves as:
#   1. A reference for users writing config files
#   2. A contract for engine developers — new engines must update this schema
#
# Configuration priority (highest wins):
#   openbias.yaml > defaults
#
# API keys are ALWAYS read from environment variables (never put keys in YAML):
#   OPENAI_API_KEY, GOOGLE_API_KEY, GEMINI_API_KEY, ANTHROPIC_API_KEY, etc.
#
# =============================================================================

# ---------------------------------------------------------------------------
# Global Settings
# ---------------------------------------------------------------------------

# Evaluation mode: sync | async (default: async)
# In async mode, evaluators run without blocking the response.
mode: async

# Enforcement action when an engine detects a policy violation:
#   block     — reject the request/response immediately
#   intervene — modify the request/response to steer the conversation
#   shadow    — log the violation but allow through unchanged (monitor-only)
# (default: intervene)
#
# Engines are pure evaluators: they detect violations and report them.
# The interceptor is the sole enforcement gateway that maps violations
# to the configured fail_action behavior.
#
# Note: block is automatically normalized to intervene when mode is async,
# since async evaluation cannot block a response that has already been sent.
fail_action: intervene

# Intervention strategy: system_prompt_append | user_message_inject
# (default: user_message_inject)
strategy: user_message_inject

# Session management (optional)
session_ttl: 3600          # session time-to-live in seconds
max_sessions: 1000         # maximum concurrent sessions

# ---------------------------------------------------------------------------
# Proxy Settings
# ---------------------------------------------------------------------------

port: 4000                 # default: 4000
host: 0.0.0.0              # default: 0.0.0.0
model: gemini/gemini-2.5-flash  # global default LLM for the proxy target

# ---------------------------------------------------------------------------
# Debug Settings
# ---------------------------------------------------------------------------

debug: false               # default: false
log_level: INFO            # default: INFO

# ---------------------------------------------------------------------------
# Evaluators — the multi-evaluator pipeline
# ---------------------------------------------------------------------------
#
# Each evaluator entry has three standard fields:
#   name  — a unique label for this evaluator (default: "unnamed")
#   type  — engine type: judge | fsm | llm | nemo (default: "judge")
#   phase — when to run: pre_call | post_call (default: "post_call")
#
# All evaluators compile from project-local `rules.md` in the current project.
# That file is the only user-authored evaluator policy input.
# Do not set evaluator-level `rules`, `rules_file`, `workflow`, `config_path`,
# or inline NeMo `config`; engine-native runtime config is internal only.
#

evaluators:

  # --- Judge evaluator (type: judge) ---
  #
  # Evaluates runtime-compiled rules using a separate LLM as judge.
  # Judge uses turn-level binary evaluation only:
  # if an aggregated rule result fails, evaluation is marked as a violation.
  #
  - name: safety-screen
    type: judge
    phase: pre_call
    # aggregation_mode: majority
    # models:
    #   - name: primary
    #     model: anthropic/claude-sonnet-4-5

  - name: behavior-eval
    type: judge
    phase: post_call

  # --- FSM evaluator (type: fsm) ---
  #
  # Deterministic rules enforcement using finite state machines.
  #
  - name: workflow-guard
    type: fsm
    phase: post_call

  # --- LLM evaluator (type: llm) ---
  #
  # LLM-based state classification and constraint evaluation.
  #
  # - name: llm-guard
  #   type: llm
  #   phase: post_call
  #   llm_model: anthropic/claude-sonnet-4-5
  #   temperature: 0.0               # default: 0.0
  #   max_tokens: 1024               # default: 1024
  #   timeout: 10.0                  # default: 10.0 seconds
  #   confident_threshold: 0.8       # state classification threshold
  #   uncertain_threshold: 0.5       # uncertainty threshold
  #   temporal_weight: 0.55          # drift detection weight
  #   cooldown_turns: 2              # turns between constraint checks
  #   max_constraints_per_batch: 5   # batch size for constraint eval

  # --- NeMo Guardrails evaluator (type: nemo) ---
  #
  # Integrates NVIDIA NeMo Guardrails for input/output rail detection.
  # NeMo is treated as a warn-only signal provider: rail activations are
  # reported as violations to the interceptor, which decides enforcement.
  #
  # - name: nemo-rails
  #   type: nemo
  #   phase: post_call
  #   fail_closed: false             # report error as violation (default: false = allow)
  #   rails:                         # which rails to enable (omit for all)
  #     - input
  #     - output

# ---------------------------------------------------------------------------
# Tracing / Observability
# ---------------------------------------------------------------------------
tracing:
  type: otlp                    # otlp | langfuse | console  (auto-enabled when set)
  endpoint: http://localhost:4317

  # Langfuse-specific (auto-enabled when keys are present)
  # langfuse_public_key: pk-...
  # langfuse_secret_key: sk-...
  # langfuse_host: https://cloud.langfuse.com

# ---------------------------------------------------------------------------
# Eval — openbias eval
# ---------------------------------------------------------------------------
# Used by `openbias eval` to run offline scenario-based evaluation.
eval:
  # Glob patterns for scenario JSON files, resolved relative to this config file.
  scenarios:
    - ./eval/scenarios/*.json     # single directory
    # - ./eval/scenarios/**/*.json  # recursive glob
