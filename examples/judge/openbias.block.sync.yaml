# Judge evaluator config (block mode, sync) — explicit deny path.
#
# Open Bias compiles project `RULES.md` into runtime rules, then the judge
# evaluates one rule at a time with binary pass/fail results.
# Keep mode=sync for true blocking behavior.
# In mode=async, fail_action=block is normalized to intervene.

port: 4000
mode: sync
fail_action: block

evaluators:
  - name: rules-judge
    type: judge
    phase: post_call
