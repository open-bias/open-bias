# Judge evaluator config — evaluates every response against rules_file.
#
# Under the hood:
# - The judge LLM (separate from your agent model) receives conversation history
#   plus the latest response.
# - Each rule is evaluated as pass/fail.
# - If any rule fails, the evaluator reports a violation.

port: 4000
fail_action: intervene        # intervene, block, or shadow on violation

evaluators:
  - name: rules-judge
    type: judge
    rules_file: ./rules.md
