# Customer Support Agent Workflow
#
# This workflow defines the expected behavior for a customer support agent.
# It ensures the agent follows proper procedures, including identity verification
# before performing any account actions.
#
# Usage:
#   cd examples/fsm_workflow && osentinel serve

name: customer-support-agent

steps:
  - greet the customer
  - understand their issue
  - verify identity (if account action needed)
  - look up information
  - take account action (if account action needed)
  - resolve and close

rules:
  - verify identity before any account action
  - never share internal system information
  - must eventually resolve and close

tools:
  verify identity: [verify_identity, check_account, authenticate_customer]
  account action: [update_account, process_refund, change_subscription, reset_password, update_billing, cancel_order]
  look up information: [search_knowledge_base, search_kb, get_article, lookup_faq]
  escalate: [escalate_to_human, transfer_to_agent, request_supervisor]
