# Copy this file into `.github/workflows/nightly-improvement.yml` in your own
# Open Bias-enabled application repo. It is kept under `examples/` here so the
# OSS repo ships a realistic workflow without enabling it for this repository.
name: openbias-nightly-improvement

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBIAS_CONFIG_PATH: openbias.yaml
  OPENBIAS_CANDIDATE_PATH: rules.candidate.md
  OPENBIAS_EVAL_SUITES_PATH: evals/suites
  OPENBIAS_TRACE_GLOB: .openbias/traces/*.jsonl
  OPENBIAS_REPORT_DIR: .openbias/reports/nightly

jobs:
  nightly-improvement:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Open Bias
        run: |
          python -m pip install --upgrade pip
          pip install openbias

      - name: Run eval, replay, compare, and review-pack flows
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p "$OPENBIAS_REPORT_DIR"
          openbias eval \
            --config "$OPENBIAS_CONFIG_PATH" \
            --suite "$OPENBIAS_EVAL_SUITES_PATH" \
            --json-output "$OPENBIAS_REPORT_DIR/evals.json"
          shopt -s nullglob
          trace_args=()
          for trace_path in $OPENBIAS_TRACE_GLOB; do
            trace_args+=(--trace "$trace_path")
          done

          if [ ${#trace_args[@]} -gt 0 ]; then
            openbias replay \
              --config "$OPENBIAS_CONFIG_PATH" \
              "${trace_args[@]}" \
              --json-output "$OPENBIAS_REPORT_DIR/replay.json"
          else
            printf '{"datasets": []}\n' > "$OPENBIAS_REPORT_DIR/replay.json"
          fi

          if [ -f "$OPENBIAS_CANDIDATE_PATH" ]; then
            openbias compare \
              --config "$OPENBIAS_CONFIG_PATH" \
              --candidate "$OPENBIAS_CANDIDATE_PATH" \
              "${trace_args[@]}" \
              --output-dir "$OPENBIAS_REPORT_DIR"
            openbias review-pack \
              --comparison "$OPENBIAS_REPORT_DIR/comparison.json" \
              --output "$OPENBIAS_REPORT_DIR/review-pack.md"
          else
            printf '%s\n' \
              "Candidate policy not found. Place a manual or externally generated file at $OPENBIAS_CANDIDATE_PATH to enable nightly comparison." \
              > "$OPENBIAS_REPORT_DIR/comparison-skipped.txt"
          fi

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openbias-nightly-artifacts
          path: .openbias/reports/nightly
          if-no-files-found: error
